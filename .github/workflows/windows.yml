name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go tool nsgo test
      - name: Check
        run: go tool nsgo check
      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build installer and portable package
        run: |
          go tool nsgo build -target windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run scripts/package-windows.go
      - uses: actions/upload-artifact@v4
        with:
          name: wood-wind-music-windows-x64
          if-no-files-found: error
          path: |
            dist/releases/*-windows-x64-setup.exe
            dist/releases/*-windows-x64-setup.exe.sha256
            dist/releases/*-windows-x64-portable.zip
            dist/releases/*-windows-x64-portable.zip.sha256
