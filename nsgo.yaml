name: 木听风音乐
# Stable identity: preserves existing library, playlists and settings.
id: dev.oneo.nsgo.music
version: 0.1.0
# Keep Android upgrades newer than the private 0.1.30 build (versionCode 130).
build_number: 131

icon:
  apple: resources/icon.icns
  png: resources/icon.png

dev:
  target: native
  icon:
    apple: resources/icon.icns
    png: resources/icon-dev.png

build:
  output: dist
  targets: [macos_arm64, windows_x64, android_arm64]

release:
  github: HengWh/woodwind-music
